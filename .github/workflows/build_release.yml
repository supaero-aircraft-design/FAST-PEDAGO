name: Build PyPI package

on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [ published ]

jobs:
  build-publish-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.10" ]
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.3.3
        shell: bash

      - name: Poetry path
        run: echo "$HOME/.poetry/bin" >> $GITHUB_PATH
        shell: bash

      - name: Build FAST-PEDAGO
        run: |
          poetry version $( echo ${{ github.ref }} | sed 's%refs/tags/%%' )
          poetry build
        shell: bash

      - name: publish FAST-PEDAGO to PyPI
        env:
          TOKEN: ${{ secrets.PYPI }} # do not use the secret directly in run command, it would write it plainly in the log
        run: |
          poetry config pypi-token.pypi "$TOKEN"
          poetry publish